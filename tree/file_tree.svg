  <text x="40" y="1360" class="note" font-style="normal">총 6개 최상위 폴더 · 코드 7개(.py 5 · .js 1 · .html 1) · 문서 6개 · 산출데이터 26개 · 발표자료 1개</text>
  <text x="40" y="1382" class="note" font-style="normal">웹 워크벤치: claude.ai/code/artifact/7c5a27c2-d582-48db-a00b-f4c421afe933</text>
