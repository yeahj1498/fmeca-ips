    <g transform="translate(0,930)"><text x="10" class="data">│   ├── lifecycle.json</text></g>
    <g transform="translate(0,954)"><text x="10" class="data">│   └── transform_sample.json</text><text x="500" class="note">원본→전처리 비교 샘플(2대)</text></g>

    <!-- app -->
