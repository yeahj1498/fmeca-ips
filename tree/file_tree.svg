    <g transform="translate(0,746)"><text x="10" class="data">│   ├── spec2_case.csv / spec2_case.json</text><text x="500" class="note">보너스 사례(14.69배)</text></g>
    <g transform="translate(0,770)"><text x="10" class="data">│   └── fmeca_worksheet.csv</text></g>

