<svg viewBox="0 0 1180 1410" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'SF Mono', 'Cascadia Code', monospace">
  <defs>
    <style>
      .bg { fill: #eef1ef; }
      .panel { fill: #ffffff; stroke: #dde3df; stroke-width: 1; }
      .guide { stroke: #ccd5cf; stroke-width: 1.3; fill: none; }
      .root { fill: #1a2422; font-weight: 700; font-size: 20px; }
      .folder { fill: #1a2422; font-weight: 700; font-size: 15.5px; }
      .folder-accent { fill: #2c6b73; font-weight: 700; font-size: 15.5px; }
      .py { fill: #2f6b3f; font-size: 14.5px; }
      .js { fill: #a8621f; font-size: 14.5px; }
      .html { fill: #1f5b63; font-weight: 700; font-size: 14.5px; }
      .pptx { fill: #a1392f; font-size: 14.5px; }
      .data { fill: #55635e; font-size: 14.5px; }
      .note { fill: #8b968f; font-size: 12.5px; font-style: italic; }
      .grp-note { fill: #2c6b73; font-size: 12.5px; font-weight: 600; font-style: normal; }
      .title { fill: #1a2422; font-size: 26px; font-weight: 700; font-family: Georgia, 'Times New Roman', serif; }
      .subtitle { fill: #55635e; font-size: 14px; font-family: Arial, Helvetica, sans-serif; }
      .swatch { rx: 3; }
      .legend-txt { fill: #55635e; font-size: 12.5px; font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="1410"/>

  <!-- header -->
  <text x="40" y="46" class="title">FMECA–IPS 연계체계 · 프로젝트 구조</text>
  <text x="40" y="70" class="subtitle">fmeca_ips_scania/  —  SCANIA Component X 실측 데이터 기반 파이프라인 (2026-09-15)</text>

  <!-- legend -->
  <g transform="translate(40,86)">
    <rect class="swatch" width="10" height="10" y="0" fill="#2f6b3f"/><text class="legend-txt" x="16" y="9">Python(.py)</text>
    <rect class="swatch" width="10" height="10" y="0" x="130" fill="#a8621f"/><text class="legend-txt" x="146" y="9">JavaScript(.js)</text>
    <rect class="swatch" width="10" height="10" y="0" x="280" fill="#1f5b63"/><text class="legend-txt" x="296" y="9">웹앱(.html)</text>
    <rect class="swatch" width="10" height="10" y="0" x="400" fill="#a1392f"/><text class="legend-txt" x="416" y="9">발표자료(.pptx)</text>
    <rect class="swatch" width="10" height="10" y="0" x="550" fill="#55635e"/><text class="legend-txt" x="566" y="9">데이터/문서(.csv·.json·.md·.pdf)</text>
  </g>

  <rect class="panel" x="20" y="112" width="1140" height="1278" rx="10"/>

