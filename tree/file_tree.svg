    <g transform="translate(0,490)"><text x="10" class="js">│   ├── 03_ips_feedback_linkage.js</text><text x="500" class="note">피드백 연계 로직(클라이언트)</text></g>
    <g transform="translate(0,514)"><text x="10" class="py">│   └── 04_export_transform_sample.py</text><text x="500" class="note">원본→전처리 샘플 추출</text></g>

