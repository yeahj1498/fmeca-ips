    </g>
    <g transform="translate(0,50)">
      <text x="10" class="data">├── 02_domain_mapping.md</text>
      <text x="450" class="note">필드 → FMECA 매핑, 대응 불가 항목</text>
    </g>
    <g transform="translate(0,74)">
