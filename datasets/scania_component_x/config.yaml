# Dataset contract instance -- see /DATASET_FORMAT.md for the full schema spec.
# Any dataset that fills in this shape can be run through scripts/run_pipeline.py
# and rendered by app/index.html without touching a line of code.

dataset:
  short_id: scania_component_x
  name: "SCANIA Component X"
  component_label: "Component X"
  license: "CC BY 4.0"
  citation: "Kharazian et al., \"SCANIA Component X dataset: a real-world multivariate time series dataset for predictive maintenance\", Scientific Data (2025)"
  source_url: "https://doi.org/10.5878/jvb5-d390"

# Paths are relative to this config file's own directory.
files:
  events: data_raw/train_tte.csv          # one row per asset: exposure time + failure label
  readouts: data_raw/train_operational_readouts.csv   # long-format time series of counters
  groups: data_raw/train_specifications.csv           # one row per asset: grouping attributes

# Column-name mapping: dataset's real column names -> pipeline's semantic roles.
columns:
  asset_id: vehicle_id
  exposure_time: length_of_study_time_step
  failure_label: in_study_repair
  readout_time: time_step
  counters: ["171_0", "666_0", "427_0", "837_0", "309_0", "835_0", "370_0", "100_0"]
  group_col: Spec_3            # primary grouping -> becomes the FMECA "failure mode" rows
  bonus_group_col: Spec_2      # optional secondary grouping for an extra drill-down case

# FMECA-row identity: maps each value of columns.group_col to a display label.
groups:
  Cat0: "형상A"
  Cat1: "형상B"
  Cat2: "형상C"
  Cat3: "형상D"

# Tunable thresholds used by the O/S/D computation. Defaults shown are what this
# SCANIA run used; a different dataset's noise/failure characteristics may need
# different values.
params:
  lookback_steps: 60             # detection lookback window, in readout_time units
  z_thresh: 2.5                  # anomaly-score threshold that defines "flagged"
  tail_readouts_for_severity: 3  # how many final readouts define the "at-repair" severity window
  bonus_group_min_size: 200      # minimum asset count for a bonus_group_col group to be reported

# IPS-linkage parameters that are NOT derivable from the dataset itself (documented
# assumptions, clearly labeled as such everywhere they are used).
assumptions:
  lead_days: 75
  unit_cost_krw: 28000000
  repair_complexity: "중상"
  fleet_size: 400
  daily_op_timesteps: 0.7
  note: "리드타임·단가·복잡도·함대 규모는 이 방법론을 가상 정비단에 적용하는 예시를 위한 가정치다. 발생률(O)만 실측."

# Narrative copy shown in the web app. Free text, dataset-specific -- this is the
# part that genuinely requires a human to write for each new dataset, since it
# needs domain judgement about what the data can and cannot support.
content:
  banner: "이 앱의 O·S·D 원천 데이터는 실측({name}, {license})입니다 — 단, 공개를 위해 익명화·섭동 처리됨. 보급소요 파라미터(리드타임·단가 등)는 예시를 위한 가정치입니다."
  overview_lede: "{name} — 실제 SCANIA 트럭 {n_vehicles:,}대의 엔진계통 구성품(\"{component_label}\") 수리기록·계측데이터를 사용했다. 단일 구성품 데이터라, 차량 사양({group_col}) {n_groups}개 그룹을 FMECA 행으로 삼아 \"같은 고장모드가 사양에 따라 어떻게 달라지는가\"를 분석한다. 아래 흐름도의 각 단계를 클릭하면 해당 탭으로 이동한다."
  fmeca_finding: "이번 실측 데이터에서는 순위 역전이 없다. D등급이 모든 그룹에서 동일(8)하게 나와 순위에 영향을 주지 못했고, O·S가 완전히 같은 순서로 정렬됐다 — 위험 요인들이 서로 강화하는 방향으로 실제로 작동한다는 뜻이다. 반면 대부분의 그룹은 조기경보 탐지율이 우연 수준과 통계적으로 구분되지 않는다(§상세는 05_ips_impact.md) — 실측 데이터의 정직한 한계."
  bonus_case_note: "주축({group_col}) 외에 다른 사양 변수({bonus_group_col})에서는 훨씬 더 극단적인 격차가 실측으로 관측된다. 표본 200대 이상인 그룹만 비교한 결과다."
  mapping_rows:
    - [ "vehicle_id · Spec_3", "specifications.csv", "차량 식별자 · 사양(형상) 그룹", "분석대상 식별키 · FMECA 행 구분 축", "23,550대, 4개 범주(Cat0~Cat3)" ]
    - [ "length_of_study_time_step", "train_tte.csv", "구성품 장착 이후 경과 time-step", "노출(exposure) 분모 — O = 수리건수 ÷ 노출", "이미 장착시점부터 기록되어 좌측절단 없음" ]
    - [ "in_study_repair", "train_tte.csv", "Component X 교체/수리 여부(0/1)", "고장모드 라벨 그 자체", "2,272건 / 23,550건 (0.4% 양성)" ]
    - [ "time_step (readouts)", "operational_readouts.csv", "판독 시점(차량별 비동기)", "정제 01단계 동기화 대상", "차량당 5~303회, 중앙값 43회로 불균일" ]
    - [ "171_0…100_0 (8개 카운터)", "operational_readouts.csv", "누적형 계측 카운터(익명화)", "S/D 관측 채널(증분율 z-점수)", "96개 히스토그램 빈은 이번 실행에서 제외" ]
  gap_rows:
    - [ "부품 실명/규격(NSN급)", "Component X 자체가 영업비밀로 익명화됨", "실제 어떤 부품을 개선해야 하는지 알 수 없음 — 조달로 직결되지 않음" ]
    - [ "정비 소요공수·비용 실측치", "논문에 투입인원·작업시간 필드 없음", "보급소요의 리드타임·단가는 가정치 사용" ]
    - [ "임무·안전 영향 등급 / 동시고장 축", "상용 트럭 데이터라 군사적 심각도 개념 부재, 단일 구성품이라 동시고장 개념도 성립 안 함", "S(심각도)는 이상지수 단일 축만 산출(HAZOP guide word+오차율로 대리 표시)" ]
    - [ "채널의 물리적 정의", "8개 카운터·96개 히스토그램 빈 모두 익명화, 논문도 의미를 밝히지 않음", "D 산출 시 '이상치 유무'만 판단 가능, 원인 설명 불가" ]
    - [ "운용부대/기후/임무유형", "상용차량 데이터라 군 운용 변수 없음", "O 층화는 차량 사양(group_col) 단위까지만 가능" ]
