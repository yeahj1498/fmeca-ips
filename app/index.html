<meta charset="utf-8">
<title>SCANIA Component X FMECA-IPS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#eef1ef; --surface:#ffffff; --surface-2:#e3e8e4; --surface-3:#d9e0da;
    --ink:#1a2422; --ink-dim:#55635e; --ink-faint:#8b968f;
    --line:#ccd5cf; --line-soft:#dde3df;
    --accent:#2c6b73; --accent-ink:#ffffff; --accent-soft:#dcebec;
    --series-b:#8a6d3b; --series-b-soft:#f1e8d8;
    --ok:#3c7a4f; --ok-bg:#e3f0e4; --ok-line:#b9d8bd;
    --gap:#a85a22; --gap-bg:#f7ebdd; --gap-line:#e3c39c;
    --crit:#a8342c; --crit-bg:#f8e2df;
    --mono-bg:#eef2f0;
    --shadow:0 1px 2px rgba(20,30,26,.06); --shadow-lg:0 6px 20px rgba(20,30,26,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111514; --surface:#181e1c; --surface-2:#1f2624; --surface-3:#262e2b;
      --ink:#e7ece9; --ink-dim:#a3afa9; --ink-faint:#6d7975;
      --line:#323c38; --line-soft:#293330;
      --accent:#7bc0c8; --accent-ink:#0d1f21; --accent-soft:#1c3236;
      --series-b:#d2b378; --series-b-soft:#2c2517;
      --ok:#7fc793; --ok-bg:#1b2a1f; --ok-line:#2f4a34;
      --gap:#e3a065; --gap-bg:#2e2115; --gap-line:#4a3521;
      --crit:#e2857b; --crit-bg:#3a1f1c;
      --mono-bg:#1e2523;
      --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111514; --surface:#181e1c; --surface-2:#1f2624; --surface-3:#262e2b;
    --ink:#e7ece9; --ink-dim:#a3afa9; --ink-faint:#6d7975;
    --line:#323c38; --line-soft:#293330;
    --accent:#7bc0c8; --accent-ink:#0d1f21; --accent-soft:#1c3236;
    --series-b:#d2b378; --series-b-soft:#2c2517;
    --ok:#7fc793; --ok-bg:#1b2a1f; --ok-line:#2f4a34;
    --gap:#e3a065; --gap-bg:#2e2115; --gap-line:#4a3521;
    --crit:#e2857b; --crit-bg:#3a1f1c;
    --mono-bg:#1e2523;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Noto Sans KR',-apple-system,sans-serif;line-height:1.55;font-size:14.5px;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:var(--accent);}
  code{font-family:'IBM Plex Mono',monospace;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .banner{background:var(--gap-bg);border-bottom:1px solid var(--gap-line);color:var(--gap);font-size:12.5px;padding:7px 16px;text-align:center;font-weight:500;}

  .app{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
  .brand .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;}
  .brand .t{font-size:16.5px;font-weight:700;margin-top:4px;letter-spacing:-.01em;text-wrap:balance;}
  .brand .s{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}

  nav.tabs{display:flex;flex-direction:column;gap:1px;}
  nav.tabs .grp{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);padding:10px 10px 3px;}
  nav.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--ink-dim);}
  nav.tabs button .num{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);width:16px;}
  nav.tabs button:hover{background:var(--surface-2);color:var(--ink);}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  nav.tabs button[aria-current="page"] .num{color:var(--accent);}
  .sidebar-foot{margin-top:auto;font-size:11px;color:var(--ink-faint);padding:8px;border-top:1px solid var(--line-soft);}

  .main{flex:1;min-width:0;padding:32px 32px 80px;}
  .content{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:32px;}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{position:sticky;top:0;width:100%;flex:none;height:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;gap:12px;z-index:10;}
    .brand{flex:0 0 auto;} .brand .s{display:none;}
    nav.tabs{flex-direction:row;flex:0 0 auto;} nav.tabs .grp{display:none;}
    .sidebar-foot{display:none;}
    .main{padding:20px 14px 60px;}
  }

  section[data-panel]{display:flex;flex-direction:column;gap:20px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .eyebrow .seg{color:var(--ink-faint);}
  h1{font-size:clamp(22px,3.2vw,30px);font-weight:700;margin:8px 0 0;text-wrap:balance;letter-spacing:-.01em;}
  h2{font-size:19px;font-weight:700;margin:0;letter-spacing:-.005em;}
  .lede{color:var(--ink-dim);font-size:14px;max-width:70ch;margin-top:8px;}
  .lede b{color:var(--ink);font-weight:600;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;}
  .stat{background:var(--surface);padding:13px 15px;display:flex;flex-direction:column;gap:4px;}
  .stat .n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:21px;font-weight:600;}
  .stat .l{font-size:11.3px;color:var(--ink-dim);}
  .stat.accent .n{color:var(--accent);} .stat.ok .n{color:var(--ok);} .stat.gap .n{color:var(--gap);}

  .sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .sec-num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;}
  .sec-desc{color:var(--ink-dim);font-size:13.2px;max-width:72ch;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
  .card-pad{padding:17px 19px;}

  /* ---------- flow diagram ---------- */
  .flow-track{display:flex;flex-wrap:wrap;align-items:stretch;gap:2px 2px;justify-content:center;}
  .flow-node{all:unset;cursor:pointer;flex:1 1 150px;max-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .1s, box-shadow .1s;}
  .flow-node:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--accent);}
  .flow-node .fn-step{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:.05em;}
  .flow-node .fn-title{font-weight:700;font-size:13.6px;color:var(--ink);}
  .flow-node .fn-stat{font-size:11.6px;color:var(--ink-dim);line-height:1.4;}
  .flow-node .fn-stat b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-variant-numeric:tabular-nums;}
  .flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:18px;flex:0 0 auto;width:22px;}
  @media (max-width:920px){
    .flow-track{flex-direction:column;align-items:stretch;}
    .flow-node{max-width:none;}
    .flow-arrow{transform:rotate(90deg);height:18px;}
  }
  .feedback-note{border:1px dashed var(--gap-line);background:var(--gap-bg);color:var(--gap);border-radius:10px;padding:10px 14px;font-size:12.4px;text-align:center;}

  /* ---------- tables ---------- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;font-size:12.8px;}
  thead th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.3px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);background:var(--surface-2);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;}
  thead th.sortable{cursor:pointer;user-select:none;}
  thead th.sortable:hover{color:var(--ink);}
  thead th .arrow{opacity:.4;margin-left:3px;}
  thead th[data-active="1"] .arrow{opacity:1;color:var(--accent);}
  tbody td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:var(--surface-2);}
  td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .field code{font-family:'IBM Plex Mono',monospace;background:var(--mono-bg);border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px;font-size:11.6px;color:var(--accent);}

  .pill{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;}
  .gw-tag{display:inline-block;margin-left:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--ink-dim);border:1px solid var(--line-soft);border-radius:4px;padding:1px 4px;vertical-align:middle;cursor:help;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);}
  .pill.gap{background:var(--gap-bg);color:var(--gap);border:1px solid var(--gap-line);}
  .pill.crit{background:var(--crit-bg);color:var(--crit);border:1px solid var(--crit);}
  .pill.neutral{background:var(--surface-2);color:var(--ink-dim);border:1px solid var(--line);}
  .pill.accent{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);}

  .gaps{display:flex;flex-direction:column;gap:1px;background:var(--gap-line);border:1px dashed var(--gap-line);border-radius:12px;overflow:hidden;}
  .gap-card{background:var(--gap-bg);padding:13px 17px;display:grid;grid-template-columns:190px 1fr;gap:6px 20px;}
  .gap-card .g-title{font-weight:600;font-size:13px;color:var(--gap);display:flex;align-items:flex-start;gap:8px;}
  .gap-card .g-title .idx{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);min-width:16px;}
  .gap-body{display:flex;flex-direction:column;gap:5px;}
  .gap-row{font-size:12.4px;color:var(--ink);}
  .gap-row b{font-family:'IBM Plex Mono',monospace;font-size:9.8px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-right:7px;}
  @media (max-width:680px){.gap-card{grid-template-columns:1fr;}}

  details.basis{border-top:1px solid var(--line-soft);}
  details.basis summary{cursor:pointer;padding:9px 11px;font-size:12.2px;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px;}
  details.basis summary::-webkit-details-marker{display:none;}
  details.basis summary::before{content:"▸";display:inline-block;transition:transform .15s;}
  details.basis[open] summary::before{transform:rotate(90deg);}
  details.basis .basis-body{padding:0 13px 13px;font-size:12.2px;color:var(--ink-dim);display:grid;gap:6px;}
  details.basis .basis-body b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px;}

  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:720px){.chart-row{grid-template-columns:1fr;}}
  .chart-title{font-size:12.2px;font-weight:600;color:var(--ink-dim);margin-bottom:9px;}
  .bars{display:flex;flex-direction:column;gap:9px;}
  .bar-row{display:grid;grid-template-columns:52px 1fr 46px;align-items:center;gap:8px;font-size:12px;}
  .bar-row .lab{font-family:'IBM Plex Mono',monospace;color:var(--ink-dim);}
  .bar-track{background:var(--surface-2);border-radius:5px;height:9px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-row .val{font-family:'IBM Plex Mono',monospace;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);}
  .legend{display:flex;gap:14px;font-size:11.4px;color:var(--ink-dim);margin-top:9px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .case-card{border:1px solid var(--gap-line);background:var(--gap-bg);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:13px;}
  .case-card h3{margin:0;font-size:15px;color:var(--gap);}
  .case-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:620px){.case-grid{grid-template-columns:1fr;}}
  .case-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;}
  .case-box .cb-label{font-size:10.6px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
  .case-box .cb-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;}
  .case-box .cb-sub{font-size:11.6px;color:var(--ink-dim);margin-top:3px;}
  .case-box.before .cb-value{color:var(--ink-dim);}
  .case-box.after .cb-value{color:var(--crit);}

  .steps{display:flex;flex-direction:column;}
  .step{display:grid;grid-template-columns:38px 1fr;gap:13px;position:relative;padding-bottom:20px;}
  .step:last-child{padding-bottom:0;}
  .step-badge{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11.8px;font-weight:600;z-index:1;}
  .step:not(:last-child)::before{content:"";position:absolute;left:18px;top:30px;bottom:-6px;width:1px;background:var(--line);}
  .step-body{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 15px;box-shadow:var(--shadow);}
  .step-title{font-weight:600;font-size:13.4px;margin-bottom:4px;}
  .step-metrics{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:7px;}
  .step-metric{font-size:11.6px;color:var(--ink-dim);}
  .step-metric b{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600;}

  /* RCM/LORA/ECP decision cards */
  .decision-grid{display:grid;grid-template-columns:1fr;gap:12px;}
  .decision-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;}
  .dc-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .dc-comp{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;}
  .dc-comp .cc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .dc-gates{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;}
  .gate{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);}
  .gate .g-ico{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
  .gate.yes .g-ico{background:var(--ok-bg);color:var(--ok);}
  .gate.no .g-ico{background:var(--crit-bg);color:var(--crit);}
  .dc-reason{font-size:12.6px;color:var(--ink-dim);}
  .dc-foot{display:flex;gap:16px;flex-wrap:wrap;font-size:11.8px;color:var(--ink-faint);border-top:1px solid var(--line-soft);padding-top:9px;}
  .dc-foot b{color:var(--ink-dim);font-weight:600;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .toolbar select, .toolbar input{font-family:'IBM Plex Sans KR',sans-serif;font-size:12.8px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
  .toolbar input{min-width:170px;}
  .toolbar .count{font-size:12px;color:var(--ink-faint);margin-left:auto;}
  .pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:9px 13px;font-size:12.2px;color:var(--ink-dim);}
  .pager button{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;color:var(--ink);}
  .pager button:disabled{opacity:.4;cursor:not-allowed;}

  .prose{font-size:13.4px;color:var(--ink);display:flex;flex-direction:column;gap:11px;max-width:76ch;}
  .prose b{color:var(--ink);}
  .prose .callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:11px 15px;color:var(--ink);font-size:13px;}

  .ecp-card{border:1px solid var(--crit);background:var(--crit-bg);border-radius:12px;padding:15px 18px;display:flex;flex-direction:column;gap:8px;}
  .ecp-card h4{margin:0;font-size:14px;color:var(--crit);}
  .ecp-list{margin:0;padding-left:18px;font-size:12.6px;color:var(--ink);display:flex;flex-direction:column;gap:5px;}
  .ecp-none{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:12.6px;color:var(--ink-dim);}

  footer.page-foot{border-top:1px solid var(--line);padding-top:15px;font-size:11.5px;color:var(--ink-faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
</style>

<div class="banner" id="banner"></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="k">FMECA → RCM → LORA → 보급 → IETM → 설계개선</div>
      <div class="t" id="brand-title">FMECA-IPS</div>
      <div class="s" id="brand-sub"></div>
    </div>
    <nav class="tabs" id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>

  <main class="main"><div class="content" id="content"></div></main>
</div>

<script>
const SECTIONS = [
  {id:"overview", num:"00", label:"개요 · 연계체계", grp:"시작"},
  {id:"mapping", num:"01", label:"데이터 → FMECA 매핑", grp:"입력"},
  {id:"cleansing", num:"02", label:"정제 파이프라인", grp:"입력"},
  {id:"fmeca", num:"03", label:"FMECA 워크시트", grp:"분석"},
  {id:"rcm", num:"04", label:"RCM 정비전략", grp:"연계"},
  {id:"lora", num:"05", label:"LORA 수리수준", grp:"연계"},
  {id:"supply", num:"06", label:"보급소요 산정", grp:"연계"},
  {id:"ietm", num:"07", label:"IETM 연계", grp:"연계"},
  {id:"ecp", num:"08", label:"설계개선(ECP)", grp:"연계"},
  {id:"feedback", num:"09", label:"피드백 시뮬레이터", grp:"연계"},
  {id:"events", num:"10", label:"사건 탐색기", grp:"참고"},
  {id:"transform", num:"11", label:"원본→전처리 비교", grp:"참고"},
];
const GROUPS = ["시작", "입력", "분석", "연계", "참고"];

const state = { dataset:null, cleansing:null, fmeca:null, events:null, lifecycle:null, transform:null,
  evFilter:{group:"", repairOnly:"", q:""}, evSort:{key:"exposure_time", dir:-1}, evPage:1, evPageSize:20 };

const GRADE_COLOR = g => g>=8 ? "var(--crit)" : g>=5 ? "var(--gap)" : "var(--ok)";
const GRADE_PILL = g => g>=8 ? "crit" : g>=5 ? "gap" : "ok";
const fmt = (n, d=2) => Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const fmt0 = n => Number(n).toLocaleString("en-US", {maximumFractionDigits:0});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const krw = n => (n/100000000).toFixed(2) + "억원";

async function loadAll(){
  const [dataset, cleansing, fmeca, events, lifecycle, transform] = await Promise.all([
    fetch("data/dataset.json").then(r=>r.json()),
    fetch("data/cleansing.json").then(r=>r.json()),
    fetch("data/fmeca.json").then(r=>r.json()),
    fetch("data/events.json").then(r=>r.json()),
    fetch("data/lifecycle.json").then(r=>r.json()),
    fetch("data/transform_sample.json").then(r=>r.json()),
  ]);
  state.dataset=dataset; state.cleansing=cleansing; state.fmeca=fmeca; state.events=events; state.lifecycle=lifecycle; state.transform=transform;
}

function buildNav(){
  const nav = document.getElementById("nav");
  let html = "";
  let lastGrp = null;
  for(const s of SECTIONS){
    if(s.grp !== lastGrp){ html += `<div class="grp">${s.grp}</div>`; lastGrp = s.grp; }
    html += `<button data-target="${s.id}"><span class="num">${s.num}</span>${s.label}</button>`;
  }
  nav.innerHTML = html;
  nav.addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) location.hash = b.dataset.target; });
}
function setActive(id){ document.querySelectorAll("nav.tabs button").forEach(b=>{ if(b.dataset.target===id) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); }); }

function router(){
  const id = (location.hash||"#overview").slice(1);
  const valid = SECTIONS.some(s=>s.id===id) ? id : "overview";
  setActive(valid); render(valid); window.scrollTo({top:0});
}
function render(id){
  const c = document.getElementById("content");
  const R = {overview:renderOverview, mapping:renderMapping, cleansing:renderCleansing, fmeca:renderFmeca,
             rcm:renderRCM, lora:renderLORA, supply:renderSupply, ietm:renderIETM, ecp:renderECP,
             feedback:renderFeedback, events:renderEvents, transform:renderTransform};
  c.innerHTML = R[id]();
  if(id==="overview") wireOverview();
  if(id==="feedback") wireFeedback();
  if(id==="events") wireEvents();
}

function byGroup(){ return Object.fromEntries(state.fmeca.modes.map(m=>[m.group,m])); }

/* ---------------- 00 OVERVIEW + FLOW ---------------- */
function wireOverview(){
  document.querySelectorAll(".flow-node, .feedback-note[data-go]").forEach(n=>{
    n.addEventListener("click", ()=>{ location.hash = n.dataset.go; });
  });
}
function flowDiagram(){
  const lc = state.lifecycle.rows;
  const stratCounts = {}; lc.forEach(r=>{ stratCounts[r.rcm_strategy] = (stratCounts[r.rcm_strategy]||0)+1; });
  const loraCounts = {}; lc.forEach(r=>{ const k=r.lora_level.split("(")[0].split("+")[0].trim(); loraCounts[k]=(loraCounts[k]||0)+1; });
  const totalDemand = lc.reduce((a,r)=>a+r.annual_demand_units,0);
  const totalCost = lc.reduce((a,r)=>a+r.annual_cost_krw,0);
  const slaCount = lc.filter(r=>r.ietm_sla).length;
  const ecpCount = lc.filter(r=>r.ecp_candidate).length;

  const nodes = [
    {step:"IN", title:"실측 운용·계측데이터", go:"mapping", stat:`수리기록 ${fmt0(state.dataset.n_vehicles)}대 · 계측 ${fmt0(state.dataset.n_readout_rows)}행`},
    {step:"03", title:"FMECA", go:"fmeca", stat:`형상군 <b>${state.fmeca.modes.length}</b>개 · O/S/D 실적 계산`},
    {step:"04", title:"RCM", go:"rcm", stat:Object.entries(stratCounts).map(([k,v])=>`${k.replace(/\(.+\)/,"")} <b>${v}</b>`).join(" · ")},
    {step:"05", title:"LORA", go:"lora", stat:Object.entries(loraCounts).map(([k,v])=>`${k} <b>${v}</b>`).join(" · ")},
    {step:"06", title:"보급소요", go:"supply", stat:`연 <b>${fmt0(totalDemand)}</b>건(가정 함대) · ${krw(totalCost)}`},
    {step:"07", title:"IETM 연계", go:"ietm", stat:`사전점검 SLA <b>${slaCount}</b>건 · 정기점검강화 <b>${lc.length-slaCount}</b>건`},
    {step:"08", title:"설계개선", go:"ecp", stat:`ECP 후보 <b>${ecpCount}</b>/${lc.length}건`},
  ];
  const track = nodes.map((n,i)=>`
    <button class="flow-node" data-go="${n.go}">
      <span class="fn-step">${n.step}</span>
      <span class="fn-title">${n.title}</span>
      <span class="fn-stat">${n.stat}</span>
    </button>${i<nodes.length-1 ? '<span class="flow-arrow">→</span>' : ''}`).join("");
  return `<div class="flow-track">${track}</div>
    <button class="feedback-note" data-go="feedback" style="cursor:pointer;width:100%;font-family:inherit;">↺ 피드백 루프 — 설계개선(ECP)이 반영되면 다음 FMECA 재평가의 O·D가 실제로 얼마나 바뀌고 RCM·보급소요가 어떻게 갱신되는지 &lt;09 피드백 시뮬레이터&gt;에서 직접 계산해보기 →</button>`;
}

  const modes = state.fmeca.modes; const s2 = state.fmeca.spec2_case;
  const maxRPN = Math.max(...modes.map(m=>m.RPN)); const maxRI = Math.max(...modes.map(m=>m.RI_weighted));
  const reversed = modes.filter(m=>m.rank_changed);

  const rows = modes.map(m=>`
    <tr>
      <td class="field"><code>${m.label}</code></td>
      <td class="num">${fmt0(m.n_vehicles)}대</td>
      <td class="num">${m.n_repairs}</td>
      <td class="num"><span class="pill ${GRADE_PILL(m.O_grade)}">${m.O_grade}</span></td>
      <td class="num"><span class="pill ${GRADE_PILL(m.S_grade)}">${m.S_grade}</span><span class="gw-tag" title="HAZOP guide word — 고장직전 신호가 자기 기준선 대비 어느 방향으로 벗어났는지">${m.hazop_guide_word}</span></td>
      <td class="num"><span class="pill ${GRADE_PILL(m.D_grade)}">${m.D_grade}</span></td>
      <td class="num mono">${m.RPN}</td><td class="num">#${m.rank_RPN}</td>
      <td class="num mono">${fmt(m.RI_weighted,1)}</td><td class="num">#${m.rank_RI}</td>
    </tr>
    <tr><td colspan="10" style="padding:0"><details class="basis"><summary>산출 근거 — ${m.label}</summary>
      <div class="basis-body"><div><b>O</b>${esc(m.O_basis)}</div><div><b>S</b>${esc(m.S_basis)}</div><div><b>D</b>${esc(m.D_basis)}</div>
      <div><b>탐지 유의성</b>${m.significant ? `우연 수준(${fmt(m.expected_rate_if_random,1)}%) 대비 통계적으로 유의(p=${m.binom_p})` : `우연 수준(${fmt(m.expected_rate_if_random,1)}%)과 통계적으로 구분 안 됨(p=${m.binom_p}) — 실질적 미검출`}</div>
      </div></details></td></tr>`).join("");

  const gradeBars = modes.map(m=>`
    <div class="bar-row"><span class="lab">${m.label}</span><div class="bar-track"><div class="bar-fill" style="width:${m.O_grade/10*100}%;background:${GRADE_COLOR(m.O_grade)}"></div></div><span class="val">O ${m.O_grade}</span></div>
    <div class="bar-row"><span class="lab"></span><div class="bar-track"><div class="bar-fill" style="width:${m.S_grade/10*100}%;background:${GRADE_COLOR(m.S_grade)}"></div></div><span class="val">S ${m.S_grade}</span></div>
    <div class="bar-row"><span class="lab"></span><div class="bar-track"><div class="bar-fill" style="width:${m.D_grade/10*100}%;background:${GRADE_COLOR(m.D_grade)}"></div></div><span class="val">D ${m.D_grade}</span></div>`).join("");
  const rpnBars = modes.map(m=>`<div class="bar-row"><span class="lab">${m.label}</span><div class="bar-track"><div class="bar-fill" style="width:${m.RPN/maxRPN*100}%;background:var(--accent)"></div></div><span class="val">${m.RPN}</span></div>`).join("");
  const riBars = modes.map(m=>`<div class="bar-row"><span class="lab">${m.label}</span><div class="bar-track"><div class="bar-fill" style="width:${m.RI_weighted/maxRI*100}%;background:var(--series-b)"></div></div><span class="val">${fmt(m.RI_weighted,1)}</span></div>`).join("");

    <div class="table-wrap"><table>
      <thead><tr><th>사양군</th><th class="num">차량수</th><th class="num">수리건수</th><th class="num">O</th><th class="num">S</th><th class="num">D</th><th class="num">RPN</th><th class="num">순위</th><th class="num">가중지수</th><th class="num">순위</th></tr></thead>
      <tbody>${rows}</tbody>

      <div class="card card-pad"><div class="chart-title">RPN(곱셈) vs 가중합산지수</div><div class="bars">${rpnBars}</div><div style="height:8px"></div><div class="bars">${riBars}</div>
        <div class="legend"><span><span class="swatch" style="background:var(--accent)"></span>RPN</span><span><span class="swatch" style="background:var(--series-b)"></span>RI</span></div></div>
    </div>

    ${state.dataset.content?.fmeca_finding ? `<div class="prose"><div class="callout">${esc(state.dataset.content.fmeca_finding)}</div></div>` : ""}

      <div class="prose">${esc(state.dataset.content?.bonus_case_note||"")}</div>

        <div class="case-box before"><div class="cb-label">${s2.bottom_group} (${s2.bottom_n}대)</div><div class="cb-value">${fmt(s2.bottom_rate,3)}<span style="font-size:12px;color:var(--ink-faint)"> /1000step</span></div><div class="cb-sub">최저 발생률 — <b>${s2.ratio}배</b> 차이</div></div>
      </div>
    </div>` : ""}

/* ---------------- 04 RCM ---------------- */
function renderRCM(){
  const lc = state.lifecycle.rows; const fm = byGroup(); const compLabel = state.dataset.component_label||state.dataset.name;
  const nCBM = lc.filter(r=>r.rcm_strategy.includes("CBM")).length;
  const cards = lc.map(r=>{
    const m = fm[r.group];
    const stratPill = r.rcm_strategy.includes("CBM") ? "ok" : r.rcm_strategy.includes("Hard") ? "gap" : "crit";
    return `
    <div class="decision-card">
      <div class="dc-head">
        <div class="dc-comp">${r.label} <span class="cc">${esc(compLabel)}</span></div>
        <span class="pill ${stratPill}">${r.rcm_strategy}</span>

/* ---------------- 09 FEEDBACK SIMULATOR ---------------- */
// re-derive RCM decision client-side with the SAME rule as scripts/02_lifecycle.py
function deriveRCM(O,S,D,significant,detectRatePct){
  if(significant && detectRatePct>=50){
    return {strategy:"상태기반정비(CBM)", pill:"ok"};
  }
  if(S>=5) return {strategy:"시간기준 예방정비(Hard-Time)", pill:"gap"};
  return {strategy:"사후정비(Run-to-Failure)", pill:"crit"};
}
// assumed intervention effect per trigger type -- documented, not measured
const O_TRIGGER_RE = /(RPN 전체 1위|발생도 최고등급)/;
const D_TRIGGER_RE = /(우연 수준과 통계적으로 구분 안 됨)/;
const ASSUMED_O_GRADE_DELTA = 2;      // 근본설계 개선 가정 -> O등급 2단계 하향
const ASSUMED_RATE_FACTOR = 0.60;     // 위와 짝을 이루는 발생률 감소 가정(약 40% 감소) -- O등급 변환과 별개로 보급소요 재계산에 직접 사용
const ASSUMED_D_GRADE_DELTA = 3;      // 진단 알고리즘/센서 고도화 가정 -> D등급 3단계 개선
const ASSUMED_NEW_DETECT_RATE = 60;   // 위 개선이 적용됐다고 가정할 때의 탐지율(%)

// LORA re-derivation -- SAME threshold as scripts/02_lifecycle.py (o >= 8 -> 창정비 우선순위 상향)
function deriveLORA(O){
  if(O>=8) return {level:"창정비 우선순위 상향 + 예비품 전진배치", pill:"gap"};
  return {level:"표준 2-Level (야전 LRU교환 + 창정비 모듈수리)", pill:"neutral"};
}
// IETM re-derivation -- SAME rule as scripts/02_lifecycle.py (유의 + 리드타임 있으면 사전점검 SLA, 아니면 정기점검 강화)
function deriveIETM(significant, leadTimeH){
  if(significant && leadTimeH){
    return {proc:"사전점검 SLA 정의", sla:Math.round(leadTimeH*0.5*10)/10, pill:"ok"};
  }
  return {proc:"정기점검 강화 (사전 SLA 없음)", sla:null, pill:"neutral"};
}
// ECP 재평가 -- 개선 후에도 트리거가 남아있는지 (전체 1위 여부는 그룹 하나만으로는 재확인 불가하므로 O=10, 비유의성만 재검사)
function deriveECP(O2, sig2){
  const stillTrig = [];
  if(O2>=10) stillTrig.push("발생도 여전히 최고등급");
  if(!sig2) stillTrig.push("이상신호 여전히 비유의");
  return {resolved: stillTrig.length===0, remaining: stillTrig};
}

function computeIntervention(m, r){
  const applyO = O_TRIGGER_RE.test(r.ecp_triggers.join(" "));
  const applyD = D_TRIGGER_RE.test(r.ecp_triggers.join(" "));
  const O2 = applyO ? Math.max(1, m.O_grade - ASSUMED_O_GRADE_DELTA) : m.O_grade;
  const D2 = applyD ? Math.max(1, m.D_grade - ASSUMED_D_GRADE_DELTA) : m.D_grade;
  const sig2 = applyD ? true : m.significant;
  const rate2Pct = applyD ? ASSUMED_NEW_DETECT_RATE : m.detection_rate_pct;
  const S2 = m.S_grade; // 설계/검출 개선이 심각도 자체를 바꾼다고 가정하지 않음
  const RPN2 = O2*S2*D2;
  const RI2 = +(0.4*O2+0.4*S2+0.2*D2).toFixed(2);
  const rate2 = applyO ? +(m.rate_per_1000*ASSUMED_RATE_FACTOR).toFixed(4) : m.rate_per_1000;
  const rcmBefore = deriveRCM(m.O_grade, m.S_grade, m.D_grade, m.significant, m.detection_rate_pct||0);
  const rcmAfter = deriveRCM(O2, S2, D2, sig2, rate2Pct||0);
  // -- 연계: LORA / IETM / ECP도 새 O2·D2·sig2로 재평가 (RCM·보급소요와 동일한 입력을 공유)
  const loraBefore = deriveLORA(m.O_grade);
  const loraAfter = deriveLORA(O2);
  const ietmBefore = deriveIETM(m.significant, m.mean_lead_time);
  const ietmAfter = deriveIETM(sig2, m.mean_lead_time);
  const ecpAfter = deriveECP(O2, sig2);
  return {applyO, applyD, O2, D2, S2, RPN2, RI2, rate2, rcmBefore, rcmAfter,
          loraBefore, loraAfter, ietmBefore, ietmAfter, ecpAfter};
}

  <section data-panel>
    <div><div class="sec-head"><span class="sec-num">09</span><h2>피드백 시뮬레이터 — ECP가 실제로 무엇을 바꾸는가</h2></div>
    <p class="sec-desc">§08의 설계개선(ECP) 트리거를 <b>실제로 적용했다고 가정</b>했을 때 O/D 등급이 바뀌고, 그 새 등급이 <b>RCM(§04)·LORA(§05)·IETM(§07)·보급소요(§06)·ECP(§08) 재평가까지 동일한 입력을 공유하며 함께 재계산</b>되는 것을 보여준다 — RCM 하나만 바뀌는 게 아니라 연계된 5개 요소가 모두 같은 O'/D'를 참조한다. 개선 효과 자체(등급 하향폭, 발생률 감소율)는 실측이 아니라 이 시뮬레이션을 위한 가정치이며, 카드마다 명시했다.</p></div>
    <div class="decision-grid">${cards}</div>
    <div class="card card-pad">
      <div class="chart-title">이게 왜 "환류(feedback)"인가</div>
      <div class="prose" style="font-size:12.8px;color:var(--ink-dim)">
        <div>실제 운용에서는 이 개선후 O'/D' 값이 <b style="color:var(--ink)">다음 분기 FMECA 재평가의 시작점</b>이 된다 — 즉 §03 FMECA 워크시트의 입력이 이번 계산 결과로 교체되고, RCM(§04)·LORA(§05)·보급소요(§06)·IETM(§07)도 그 위에서 다시 산정된다. 이 앱은 그 한 사이클(ECP→재계산)만 정적으로 보여주지만, 실제 체계라면 이 표가 매 재평가 주기마다 갱신되는 루프가 된다.</div>
      </div>
    </div>
  </section>`;
}

/* ---------------- 10 EVENTS ---------------- */
function wireEvents(){
  const grpSel = document.getElementById("ev-group"); const repSel = document.getElementById("ev-repair"); const q = document.getElementById("ev-q");
  grpSel.addEventListener("change", ()=>{state.evFilter.group=grpSel.value; state.evPage=1; renderEventsTable();});
  repSel.addEventListener("change", ()=>{state.evFilter.repairOnly=repSel.value; state.evPage=1; renderEventsTable();});
  q.addEventListener("input", ()=>{state.evFilter.q=q.value.trim(); state.evPage=1; renderEventsTable();});
  document.querySelectorAll("#ev-thead th.sortable").forEach(th=>th.addEventListener("click", ()=>{
    const key = th.dataset.key;
    if(state.evSort.key===key) state.evSort.dir *= -1; else {state.evSort.key=key; state.evSort.dir=1;}
    renderEventsTable();
  }));
  document.getElementById("ev-prev").addEventListener("click", ()=>{ if(state.evPage>1){state.evPage--; renderEventsTable();} });
  document.getElementById("ev-next").addEventListener("click", ()=>{ state.evPage++; renderEventsTable(); });
  renderEventsTable();
}
function filteredEvents(){
  const f = state.evFilter;
  let rows = state.events.filter(e => (!f.group||e.group===f.group) && (f.repairOnly===""||String(e.failed)===f.repairOnly) && (!f.q||String(e.asset_id).includes(f.q)));
  const {key,dir} = state.evSort;
  rows = rows.slice().sort((a,b)=>{ let av=a[key],bv=b[key]; if(typeof av==="string"&&typeof bv==="string") return av.localeCompare(bv)*dir; return ((av>bv)-(av<bv))*dir; });
  return rows;
}
function renderEventsTable(){
  const rows = filteredEvents(); const pageSize = state.evPageSize;
  const maxPage = Math.max(1, Math.ceil(rows.length/pageSize));
  if(state.evPage>maxPage) state.evPage=maxPage;
  const start=(state.evPage-1)*pageSize; const page = rows.slice(start,start+pageSize);
  document.getElementById("ev-count").textContent = `${rows.length.toLocaleString()}건 표시 중 (샘플 ${state.events.length}건 — 전체 고장 ${fmt0(state.dataset.n_repairs)}건 + 무고장 표본)`;
  document.getElementById("ev-tbody").innerHTML = page.map(e=>`<tr>
      <td class="mono" style="color:var(--ink-faint)">${e.asset_id}</td>
      <td>${e.group_label||e.group}</td>
      <td class="num">${e.failed ? '<span class="pill crit">수리</span>' : '<span class="pill neutral">무고장</span>'}</td>
      <td class="num mono">${fmt(e.exposure_time,1)}</td>
      <td class="num mono">${e.severity_anomaly_at_end!=null?fmt(e.severity_anomaly_at_end,3):"–"}</td>
      <td class="num mono">${e.first_flag_time_step!=null?fmt(e.first_flag_time_step,1):"–"}</td>
      <td class="num">${e.detected_within_lookback?'<span class="pill ok">탐지</span>':'<span class="pill neutral">없음</span>'}</td>
      <td class="num mono">${e.lead_time!=null?fmt(e.lead_time,1):"–"}</td>
    </tr>`).join("");
  document.querySelectorAll("#ev-thead th.sortable").forEach(th=>{
    th.dataset.active = th.dataset.key===state.evSort.key ? "1":"0";
    const arrow = th.querySelector(".arrow");
    if(arrow) arrow.textContent = th.dataset.key===state.evSort.key ? (state.evSort.dir===1?"▲":"▼") : "▲";
  });
  document.getElementById("ev-page-label").textContent = `${state.evPage} / ${maxPage}`;
  document.getElementById("ev-prev").disabled = state.evPage<=1;
  document.getElementById("ev-next").disabled = state.evPage>=maxPage;
}
function renderEvents(){
  const d = state.dataset;
  const groups = [...new Set(state.events.map(e=>e.group))].sort();
  return `
  <section data-panel>
    <div><div class="sec-head"><span class="sec-num">09</span><h2>사건 탐색기</h2></div>
    <p class="sec-desc">자산 단위 원자료 표본(전체 고장 자산 ${fmt0(d.n_repairs)}개 + 무고장 자산 무작위 표본). 그룹·고장여부로 필터링하고 열 헤더를 클릭해 정렬한다.</p></div>
    <div class="toolbar">
      <select id="ev-group"><option value="">전체 그룹</option>${groups.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
      <select id="ev-repair"><option value="">고장여부 전체</option><option value="1">고장만</option><option value="0">무고장만</option></select>
      <input id="ev-q" type="text" placeholder="자산ID 검색…">
      <span class="count" id="ev-count"></span>
    </div>
    <div class="table-wrap"><table>
      <thead id="ev-thead"><tr>
        <th class="sortable" data-key="asset_id">자산ID<span class="arrow">▲</span></th>
        <th class="sortable" data-key="group">그룹<span class="arrow">▲</span></th>
        <th class="sortable" data-key="failed">고장여부<span class="arrow">▲</span></th>
        <th class="sortable num" data-key="exposure_time">노출(time-step)<span class="arrow">▲</span></th>
        <th class="sortable num" data-key="severity_anomaly_at_end">최종 이상지수<span class="arrow">▲</span></th>
        <th class="sortable num" data-key="first_flag_time_step">최초 경보시점<span class="arrow">▲</span></th>
        <th>탐지 여부</th>
        <th class="sortable num" data-key="lead_time">리드타임<span class="arrow">▲</span></th>
      </tr></thead>
      <tbody id="ev-tbody"></tbody>
    </table>
    <div class="pager"><button id="ev-prev">← 이전</button><span id="ev-page-label" class="mono"></span><button id="ev-next">다음 →</button></div>
    </div>
  </section>`;
}

/* ---------------- 11 RAW -> PROCESSED TRANSFORM ---------------- */
function transformSampleCard(sample, counters, zThresh){
  const m = sample.mapped;
  const ds = sample.derived_summary;
  const rm = sample.raw_mapping;
  const mapRows = [
    [`${rm.asset_id_field} (원본)`, rm.asset_id, "자산 식별키", sample.asset_id],
    [`${rm.group_field} (원본, 익명 범주)`, rm.group, "형상(FMECA 행) 라벨", m.group_label],
    [`${rm.label_field} (원본, 0/1)`, rm.failed, "고장모드 라벨", m.failure_label],
    [`${rm.exposure_field} (원본)`, fmt(rm.exposure_time,1), "노출(exposure), O의 분모", fmt(m.exposure_time_step,1)+" time-step"],
  ];
  const mapTable = `<div class="table-wrap"><table>
    <thead><tr><th>원본 필드 · 값</th><th></th><th>매핑된 의미 · 값</th></tr></thead>
    <tbody>${mapRows.map(r=>`<tr>
      <td class="field"><code>${r[0]}</code> = <b>${r[1]}</b></td>
      <td class="num" style="color:var(--ink-faint)">→</td>
      <td style="color:var(--accent);font-weight:500">${r[2]} = <b>${r[3]}</b></td>
    </tr>`).join("")}</tbody></table></div>`;

  const rawHead = counters.map(c=>`<th class="num">${c}</th>`).join("");
  const rows = sample.raw_rows.map((rr,i)=>{
    const pr = sample.processed_rows[i];
    const rawCells = counters.map(c=>`<td class="num mono" style="font-size:10.5px;color:var(--ink-dim)">${rr.counters[c]!=null?fmt0(rr.counters[c]):'–'}</td>`).join("");
    const az = pr.anomaly_score;
    const azColor = az==null ? "var(--ink-faint)" : (az>zThresh ? "var(--crit)" : (az>1.5 ? "var(--gap)" : "var(--ok)"));
    return `<tr>
      <td class="num mono" style="font-weight:600">${fmt(rr.time_step,1)}</td>
      ${rawCells}
      <td class="num mono" style="font-weight:700;color:${azColor};border-left:1px solid var(--line)">${az!=null?fmt(az,2):'–'}</td>
      <td class="num">${pr.flagged?'<span class="pill crit">경보</span>':''}</td>
    </tr>`;
  }).join("");

  const bars = sample.processed_rows.map(pr=>{
    const az = pr.anomaly_score;
    const w = az!=null ? Math.min(100, az/4*100) : 0;
    const color = az==null?"var(--ink-faint)":(az>zThresh?"var(--crit)":(az>1.5?"var(--gap)":"var(--ok)"));
    return `<div class="bar-row"><span class="lab">${fmt(pr.time_step,0)}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div><span class="val">${az!=null?fmt(az,2):'–'}</span></div>`;
  }).join("");

  const outcome = ds.detected_within_lookback
    ? `<span class="pill ok">탐지 성공</span> 최초 경보 t=${fmt(ds.first_flag_time_step,1)} → 리드타임 ${fmt(ds.lead_time,1)} time-step`
    : `<span class="pill neutral">탐지 실패</span> anomaly_score가 ${zThresh}를 관측기간 중 넘지 못함(또는 60step 밖)`;

  return `
  <div class="card card-pad" style="display:flex;flex-direction:column;gap:14px;">
    <div class="dc-head">
      <div class="dc-comp">${m.group_label} · 자산 #${sample.asset_id} <span class="cc">(${ds.n_readouts}개 판독)</span></div>
      ${outcome}
    </div>
    <div>
      <div class="chart-title">① 원본 필드 → 매핑된 FMECA 입력</div>
      ${mapTable}
    </div>
    <div>
      <div class="chart-title">② 원본 계측값(8개 누적카운터) → 전처리 결과(이상지수), 같은 행</div>
      <div class="table-wrap"><table>
        <thead><tr><th class="num">time_step</th>${rawHead}<th class="num" style="border-left:1px solid var(--line)">anomaly_score</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div>
      <div class="chart-title">③ 이상지수 추세 (임계값 ${zThresh})</div>
      <div class="bars">${bars}</div>
    </div>
  </div>`;
}
function renderTransform(){
  const t = state.transform;
  const cards = t.samples.map(s => transformSampleCard(s, t.counters, t.z_thresh)).join("");
  const grpLabels = [...new Set(t.samples.map(s=>s.mapped.group_label))];
  const grpDesc = grpLabels.length===1 ? `모두 ${grpLabels[0]}의 실제 고장 자산이며, ` : "각각 다른 그룹의 실제 고장 자산이며, ";
  return `
  <section data-panel>
    <div><div class="sec-head"><span class="sec-num">11</span><h2>원본 → 전처리 데이터 직접 비교</h2></div>
    <p class="sec-desc">§02 정제 파이프라인이 요약 통계만 보여줬다면, 여기서는 실제 자산 ${t.samples.length}개의 <b>원본 판독행 전부</b>를 골라 같은 행에서 원본 값과 전처리(증분율→자기기준 z→이상지수) 결과를 나란히 보여준다. ${grpDesc}하나는 조기경보가 성공했고 하나는 실패했다 — 같은 변환식이 실측에서 어떻게 다른 결과로 이어지는지 원자료 그대로 확인할 수 있다.</p></div>
    ${cards}
    <div class="lede">전체 파이프라인과 동일한 수식을 이 자산들에 대해서만 별도 재계산한 값이며, outputs/vehicle_features.csv의 같은 자산 값과 소수점까지 일치함을 확인했다.</div>
  </section>`;
}

/* ---------------- boot ---------------- */

  buildNav();
  document.getElementById("content").innerHTML = `<div class="lede">데이터 불러오는 중…</div>`;
  try{
    await loadAll();
    const d = state.dataset;
    document.title = `${d.name} FMECA-IPS`;
    document.getElementById("banner").textContent = "✅ " + (d.content?.banner || `이 앱의 O·S·D 원천 데이터는 실측(${d.name}, ${d.license})입니다.`);
    document.getElementById("brand-title").textContent = `${d.name} 연계체계`;
    document.getElementById("brand-sub").textContent = `실측 데이터(${d.license})로 실증한 FMECA-IPS 연계 파이프라인`;
    document.getElementById("sidebar-foot").textContent = `${d.name} dataset · ${d.license} · 실측(섭동처리)`;
    window.addEventListener("hashchange", router);
    router();
  }catch(err){
    document.getElementById("content").innerHTML = `<div class="lede" style="color:var(--crit)">데이터 로드 실패: ${esc(err.message)}</div>`;
  }
})();
</script>
